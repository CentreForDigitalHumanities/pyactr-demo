name: Deploy Angular App to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          yarn

      - name: Build Angular App
        run: yarn build -- --configuration production --base-href /${{ github.event.repository.name }}/

      - name: Add .nojekyll file
        run: touch ./dist/pyactr-demo/browser/.nojekyll

      - name: Copy index.html to 404.html
        run: cp ./dist/pyactr-demo/browser/index.html ./dist/pyactr-demo/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/pyactr-demo/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
