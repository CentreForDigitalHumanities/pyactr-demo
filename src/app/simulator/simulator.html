<div class="container-fluid px-4 py-5">
    <div class="row">
        <div class="col-lg-6">
            <form [formGroup]="form" class="card">
                <div class="card-header">
                    <h2 class="fs-4 mb-0">Simulation code</h2>
                </div>
                <div class="list-group list-group-flush">
                    <div class="list-group-item p-2">
                        <div class="d-flex align-items-center justify-content-between gap-4">
                            <div class="d-flex gap-2">
                                <button
                                    class="btn btn-light"
                                    type="button"
                                    title="Copy code to clipboard"
                                    (click)="copyToClipboard()">
                                    Copy
                                </button>
                                <button
                                    class="btn btn-light"
                                    type="button"
                                    title="Save code as a Python file"
                                    (click)="downloadAsPythonFile()">
                                    Download
                                </button>
                            </div>
                            <div class="d-flex gap-2">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch" id="switchTabIndent" (change)="onCheckedTabIndent($event)" checked>
                                    <label class="form-check-label" for="switchTabIndent">Indent with Tab</label>
                                </div>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch" id="switchDarkTheme" (change)="onCheckedDarkTheme($event)">
                                    <label class="form-check-label" for="switchDarkTheme">Dark Theme</label>
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <button
                                    class="btn btn-success"
                                    type="submit"
                                    title="Run simulation"
                                    (click)="submit()">
                                    Run
                                </button>
                                <button
                                    class="btn btn-danger"
                                    type="button"
                                    title="Stop simulation"
                                    (click)="stop()">
                                    Stop
                                </button>
                            </div>
                        </div>
                    </div>
                    <code-editor
                            id="input-code"
                            class="list-group-item p-0"
                            rows="24"
                            [formControl]="form.controls.code"
                            [languages]="languages"
                            language="Python"
                            [indentWithTab]="indentWithTab()"
                            [theme]="theme()"
                    />
                </div>
            </form>
        </div>
        <div class="col-lg-6">
            <app-simulator-output [simulation]="simulationManager.current$ | async" />
        </div>
    </div>
</div>
