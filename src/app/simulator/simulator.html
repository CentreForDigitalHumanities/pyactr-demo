<div class="container-fluid px-4 py-5">
    <div class="row">
        <div class="col-lg-6">
            <h2>Model</h2>
            <form [formGroup]="form">
                <div class="my-3">
                    <label class="form-label col-form-label-lg" for="input-code">Simulation code</label>
                    <div class="d-flex align-items-center justify-content-between gap-4 my-3">
                        <div class="d-flex gap-2">
                            <button
                                class="btn btn-light"
                                type="button"
                                title="Copy code to clipboard"
                                (click)="copyToClipboard()">
                                Copy
                            </button>
                            <button
                                class="btn btn-light"
                                type="button"
                                title="Save code as a Python file"
                                (click)="downloadAsPythonFile()">
                                Download
                            </button>
                        </div>
                        <div class="d-flex gap-2">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="switchTabIndent" (change)="onCheckedTabIndent($event)" checked>
                                <label class="form-check-label" for="switchTabIndent">Indent with Tab</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="switchDarkTheme" (change)="onCheckedDarkTheme($event)">
                                <label class="form-check-label" for="switchDarkTheme">Dark Theme</label>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button
                                class="btn btn-success"
                                type="submit"
                                title="Run simulation"
                                (click)="onSubmit('run')">
                                Run
                            </button>
                            <button
                                class="btn btn-danger"
                                type="submit"
                                title="Stop simulation"
                                (click)="onSubmit('stop')">
                                Stop
                            </button>
                        </div>
                    </div>
                    <code-editor
                        id="input-code"
                        class="form-control font-monospace text-nowrap overflow-x-scroll"
                        rows="24"
                        [formControl]="form.controls.code"
                        [languages]="languages"
                        language="Python"
                        [indentWithTab]="indentWithTab()"
                        [theme]="theme()"
                    />
                </div>
            </form>
        </div>
        <div class="col-lg-6">
            <h2 class="mb-3">Output</h2>

            @if (simulationManager.current$ | async; as simulation) {
                <app-simulator-output [simulation]="simulation" />
            }
        </div>
    </div>
</div>
