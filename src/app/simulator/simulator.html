<div class="container-fluid px-4 py-5">
    <div class="row">
        <div class="col-lg-6">
            <h2>Model</h2>
            <form [formGroup]="form">
                <div class="my-3">
                    <label class="form-label" for="input-code">Simulation code</label>
                    <textarea class="form-control font-monospace text-nowrap overflow-x-scroll" rows="24"
                        [formControl]="form.controls.code"></textarea>
                </div>
                <div class="d-flex justify-content-end gap-2 my-3">
                    <button 
                        class="btn btn-light" 
                        type="button" 
                        title="Copy code to clipboard" 
                        (click)="copyToClipboard()">
                        Copy
                    </button>
                    <button 
                        class="btn btn-light" 
                        type="button" 
                        title="Save code as a Python file" 
                        (click)="downloadAsPythonFile()">
                        Download
                    </button>
                    <button 
                        class="btn btn-success" 
                        type="submit" 
                        title="Run simulation"
                        (click)="onSubmit('run')">
                        Run
                    </button>
                    <button 
                        class="btn btn-danger" 
                        type="submit" 
                        title="Stop simulation"
                        (click)="onSubmit('stop')">
                        Stop
                    </button>
                </div>
            </form>
        </div>
        <div class="col-lg-6">
            <h2 class="mb-3">Output</h2>

            <app-output-status [simulation]="simulationManager.current$ | async" />

            @if (simulationManager.current$ | async; as simulation) {
                <div class="my-3">
                    <app-output-console [console]="simulation.console()" />
                </div>
            }
        </div>
    </div>
</div>
