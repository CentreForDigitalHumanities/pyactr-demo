<div class="p-2" role="status">
    @if (simulation(); as simulation) {
        @if (simulation.loading()) {
            <div class="spinner-border spinner-border-sm me-1" aria-hidden></div>
            Importing libraries
        } @else if (!(simulation.finished$ | async)) {
            <div class="spinner-border spinner-border-sm me-1" aria-hidden></div>
            Running code...
        } @else {
            Finished!
        }
    }
</div>
