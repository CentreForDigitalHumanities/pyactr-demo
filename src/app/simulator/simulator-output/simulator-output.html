<div class="card">
    <div class="card-header">
        <app-output-status [simulation]="simulation()" />
    </div>
    <div class="list-group list-group-flush">
        @if (simulation().scriptConsole().length) {
            <div class="list-group-item">
                <h3 class="fs-5">Script output</h3>
                <app-output-console [console]="simulation().scriptConsole()" />
            </div>
        }
        @if (simulation().stepperAvailable()) {
            <div class="list-group-item">
                <h3 class="fs-5">Simulation</h3>
                <div class="my-3">
                    <app-stepper [simulation]="simulation()" />
                </div>
                <app-output-console [console]="simulation().simulationConsole()" />
            </div>
        }
    </div>
</div>
