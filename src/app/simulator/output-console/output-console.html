<div class="rounded-top bg-secondary text-bg-secondary fw-bold px-2 py-1 font-monospace">
    output
</div>
<div class="rounded-bottom bg-body-secondary py-2">
    <div aria-live="polite" aria-relevant="additions">
        @for (event of console(); track $index) {
            <div class="px-2 py-1"
                [class.bg-danger-subtle]="isErr(event)">
                <pre class="mb-0">{{event.value}}</pre>
            </div>
        } @empty {
            &nbsp;
        }
    </div>
</div>
