<div class="container-fluid p-4 bg-body-secondary">
    <h1>Run simulation</h1>

    <p class="mb-0">Here you can create and run simulations using PyACT-R.</p>
</div>

<div class="container-fluid px-4 py-5">
    <div class="row">
        <div class="col-lg-6">
            <h2>Model</h2>
            <form [formGroup]="form" (submit)="onSubmit()">
                <div class="my-3">
                    <label class="form-label" for="input-code">Simulation code</label>
                    <textarea class="form-control font-monospace text-nowrap overflow-x-scroll" rows="24"
                        [formControl]="form.controls.code"></textarea>
                </div>
                <div class="my-3">
                    <button class="btn btn-success" type="submit">Run</button>
                </div>
            </form>
        </div>
        <div class="col-lg-6">
            <h2>Output</h2>

            @if (!(pyodide$ | async)) {
                <p>Loading libraries...</p>
            } @else {
                @if (output$ | async) {
                    <div class="bg-light p-3 my-4 rounded">
                        <pre>{{output$ | async}}</pre>
                    </div>
                }

                @if (error$ | async) {
                    <h3>Error messages</h3>
                    <div class="bg-danger-subtle my-4 p-3 rounded">
                        <pre>{{error$ | async}}</pre>
                    </div>
                }
            }

        </div>
    </div>
</div>
