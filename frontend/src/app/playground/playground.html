<div class="container-fluid p-4 bg-body-secondary">
    <h1>Playground</h1>

    <p class="mb-0">Here you can create and run simulations using PyACT-R.</p>
</div>

<div class="container-fluid px-4 py-5">
    <div class="row">
        <div class="col-lg">
            <h2>Model</h2>
            <form>
                <div class="my-3">
                    <label class="form-label" for="input-code">Simulation code</label>
                    <textarea class="form-control" rows="24"></textarea>
                </div>
                <div class="my-3">
                    <button class="btn btn-success">Run</button>
                </div>
            </form>
        </div>
        <div class="col-lg">
            <h2>Output</h2>
        </div>
    </div>
</div>
